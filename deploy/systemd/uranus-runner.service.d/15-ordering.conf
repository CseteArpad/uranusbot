# Uranus U-2B (Patch C) – runner indítási sorrend.
#
# Cél: a tick runner SOHA ne induljon el a Freqtrade előtt.
#
# Indok: a jelenlegi pozíció-szinkron az FT elérhetetlenségét „nincs nyitott
# pozíció”-ként értelmezi (fail-open FLAT, U-2A / F pont). Ha a runner megelőzi
# a Freqtrade-et, az első tickek pontosan ezt a hibás állapotot állítják elő és
# perzisztálják. A fail-open javítása külön fázis (U-3); ez a drop-in csak azt
# a legkézenfekvőbb esetet zárja ki, amikor az indítási sorrend miatt következik
# be.
#
# Miért Wants= és nem Requires=:
#   After=  önmagában csak akkor rendez, ha mindkét unit UGYANABBAN a systemd
#           tranzakcióban indul. Mivel mindhárom Uranus unit `disabled`
#           állapotban van (U-2A), egy kézi `systemctl start uranus-runner`
#           nem húzná be a Freqtrade-et, és az After= nem érvényesülne.
#   Wants=  gyenge függés: a runner indítása elindítja a Freqtrade-et is, és az
#           After=-szal együtt a sorrend is garantált. Ha a Freqtrade KÉSŐBB
#           összeomlik vagy leáll, a runner NEM áll le vele – nincs cascade.
#   Requires= a stop/restart propagációja miatt elvetve: a Freqtrade minden
#           leállása magával rántaná a runnert, és mivel mindkét unit
#           `Restart=always`, ez restart-hurkot okozhatna. Egy kereskedő
#           runnert nem akarunk a végrehajtó réteg minden zökkenőjén
#           újraindítani.
#   BindsTo= ugyanezért, még erősebben, elvetve.
#
# Telepítés (production, KÜLÖN jóváhagyással – az U-2B lokális köre NEM
# módosít production systemd-et):
#   install -m 0644 15-ordering.conf \
#       /etc/systemd/system/uranus-runner.service.d/15-ordering.conf
#   systemctl daemon-reload
#   # A meglévő futó folyamatot ez NEM indítja újra; a sorrend a következő
#   # indításnál lép életbe.
#
# Ellenőrzés:
#   systemctl show uranus-runner.service -p After -p Wants | tr ' ' '\n' \
#       | grep uranus-freqtrade

[Unit]
After=uranus-freqtrade.service
Wants=uranus-freqtrade.service
